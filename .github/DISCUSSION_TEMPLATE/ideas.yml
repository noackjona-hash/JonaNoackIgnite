title: "[IDEA]: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Share ideas for future versions, new inflammation detection techniques, or research collaborations!
  - type: textarea
    id: idea
    attributes:
      label: Proposed Idea
      description: Describe your idea or conceptual approach.
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      description: Why would this idea be valuable for clinicians or researchers?
