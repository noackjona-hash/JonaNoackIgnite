title: "[Q&A]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about **IGNITE**, methodology, setup, or scientific research background.
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know or need assistance with?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant background details, code snippets, or system information.
