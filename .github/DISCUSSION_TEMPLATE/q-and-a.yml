title: "[Q&A]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Stelle eine Frage zu **IGNITE**, zur Methodik, Installation oder wissenschaftlichen Arbeit für Jugend forscht 2026.
  - type: textarea
    id: question
    attributes:
      label: ❓ Deine Frage
      description: Was möchtest du wissen oder worüber benötigst du Hilfe?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: ℹ️ Kontext
      description: Relevante Hintergrundinfos, Code-Snippets oder Systemdetails.
