name: Release IGNITE Medical Imaging Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (z. B. v12.3.4.81)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            core/go.sum
            desktop/go.sum

      - name: Build Go AVX2 Core
        working-directory: core
        run: |
          go build -ldflags="-s -w" -v -o ignite-core.exe ./cmd/ignite-core

      - name: Build Go Desktop Workstation
        working-directory: desktop
        run: |
          go build -ldflags="-H windowsgui -s -w" -v -o Ignite.exe .

      - name: Bundle Portable Release
        run: |
          New-Item -ItemType Directory -Path "release\publish" -Force | Out-Null
          Copy-Item -Path "desktop\Ignite.exe" -Destination "release\publish\Ignite.exe" -Force
          if (Test-Path "desktop\Ignite.exe.manifest") {
            Copy-Item -Path "desktop\Ignite.exe.manifest" -Destination "release\publish\Ignite.exe.manifest" -Force
          }
          Copy-Item -Path "core\ignite-core.exe" -Destination "release\publish\ignite-core.exe" -Force
          Copy-Item -Path "rules" -Destination "release\publish\rules" -Recurse -Force
          if (Test-Path "desktop\ignite_medical.db") {
            Copy-Item -Path "desktop\ignite_medical.db" -Destination "release\publish\ignite_medical.db" -Force
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "release\publish\*" -DestinationPath "dist\IGNITE_Portable_Windows_x64.zip" -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"

      - name: Resolve Release Tag Name
        id: vars
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -f "VERSION" ]; then
            RAW_V=$(cat VERSION | tr -d ' \r\n')
            TAG="v${RAW_V}"
          else
            TAG="v12.3.4.81"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: IGNITE Medical Imaging Suite ${{ steps.vars.outputs.tag }}
          files: |
            dist/IGNITE_Medical_Suite_*_Setup.exe
            dist/IGNITE_Portable_Windows_x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
