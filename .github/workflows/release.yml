name: Multi-OS Build and Release (Windows & Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release-Tag / Version (optional, z. B. v3.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        id: ver
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -f "VERSION" ]; then
            RAW_V=$(cat VERSION | tr -d ' \r\n')
            TAG="v${RAW_V}"
          else
            TAG="v3.3.0"
          fi
          VER="${TAG#v}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Resolved Version: ${VER} (Tag: ${TAG})"

  build-windows:
    name: Build Windows Setup (.exe)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller maturin

      - name: Build Rust Core Wheel
        run: |
          maturin build --release --strip
          $wheel = Get-ChildItem target/wheels -Filter "*.whl" | Select-Object -First 1
          pip install $wheel.FullName

      - name: Build PyInstaller Executable
        run: pyinstaller --noconfirm installer/Ignite.spec

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.resolve-version.outputs.version }} installer\ignite_installer.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGNITE_Windows_Setup
          path: IGNITE_Setup_*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux Package (.tar.gz)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0 build-essential

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller maturin

      - name: Build Rust Core
        run: |
          maturin build --release --strip
          pip install target/wheels/*.whl

      - name: Build Linux Standalone Executable Bundle
        run: |
          pyinstaller --noconfirm installer/Ignite.spec
          du -sh dist/IGNITE

      - name: Create Linux Tarball Archive
        run: |
          cd dist
          tar -czvf ../IGNITE_Linux_x86_64.tar.gz IGNITE
          cd ..
          ls -lh IGNITE_Linux_x86_64.tar.gz

      - name: Upload Linux Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGNITE_Linux_Package
          path: IGNITE_Linux_x86_64.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [resolve-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: IGNITE_Windows_Setup
          path: dist_release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: IGNITE_Linux_Package
          path: dist_release

      - name: Inspect Release Artifacts
        run: |
          ls -la dist_release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: IGNITE Medical Imaging Suite ${{ needs.resolve-version.outputs.tag_name }}
          files: |
            dist_release/IGNITE_Setup_*.exe
            dist_release/IGNITE_Linux_x86_64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
