name: Build, Test & Package IGNITE Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    name: Build Go AVX2 Core, .NET 10 WPF Workstation & Inno Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Go 1.24+
      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: core/go.sum

      # 1b. Setup .NET 10 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Test & Build Go AVX2 Core
      - name: Test Go Core & AVX2 SIMD Assembly
        working-directory: core
        run: |
          go test -v ./pkg/...

      - name: Build Go Core Executable
        working-directory: core
        run: |
          go build -ldflags="-s -w" -v -o ignite-core.exe ./cmd/ignite-core

      # 3. Build & Publish .NET 10 WPF Medical Workstation
      - name: Build & Publish .NET 10 WPF Desktop Workstation
        run: |
          New-Item -ItemType Directory -Path "release\publish" -Force | Out-Null
          dotnet build desktop/Ignite.Desktop.csproj -c Release
          dotnet publish desktop/Ignite.Desktop.csproj -c Release -r win-x64 --self-contained false -o "release\publish"

      # 4. Setup Python & Run Manifest / Version Consistency Tests
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Run Manifest & Version Consistency Tests
        run: |
          pytest tests/test_versioning.py -v

      # 5. Bundle Go Core, Rules and DB into Publish Directory
      - name: Bundle Executables and Dependencies
        run: |
          Copy-Item -Path "core\ignite-core.exe" -Destination "release\publish\ignite-core.exe" -Force
          Copy-Item -Path "rules" -Destination "release\publish\rules" -Recurse -Force
          if (Test-Path "desktop\ignite_medical.db") {
            Copy-Item -Path "desktop\ignite_medical.db" -Destination "release\publish\ignite_medical.db" -Force
          }

      # 6. Install Inno Setup 6 & Compile Installer
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"

      # 7. Upload Installer & Published Workstation Artifacts
      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: IGNITE-Installer-Windows-x64
          path: dist/IGNITE_Medical_Suite_v12.3.4.81_Setup.exe
          if-no-files-found: error

      - name: Upload Portable Published Suite
        uses: actions/upload-artifact@v4
        with:
          name: IGNITE-Portable-Windows-x64
          path: release/publish/
          if-no-files-found: error
