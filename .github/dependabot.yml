version: 2
updates:
  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go Core Module
  - package-ecosystem: "gomod"
    directory: "/core"
    schedule:
      interval: "weekly"

  # Go Desktop Workstation Module
  - package-ecosystem: "gomod"
    directory: "/desktop"
    schedule:
      interval: "weekly"

  # Python Dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
