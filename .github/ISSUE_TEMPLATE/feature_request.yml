name: "Feature Request"
description: "Suggest a new feature, algorithm, or enhancement for IGNITE"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a functional enhancement, new mathematical algorithm, or UI capability for **IGNITE**!
  - type: textarea
    id: problem
    attributes:
      label: Motivation and Clinical Rationale
      description: What scientific, diagnostic, or technical problem does this feature solve?
      placeholder: Describe the problem or need...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work or be mathematically formulated?
      placeholder: Detailed description of the solution...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Component Category
      options:
        - "Signal and Image Processing (Filters, Segmentation, Morphology)"
        - "Clinical Diagnostics & Metrics (Asymmetry, TSI, IWGDF, Pennes Bioheat)"
        - "High-Performance Core (Rust, Rayon, PyTorch GPU)"
        - "GUI & Visualization (Material 3, Histogram, Charts, ROI)"
        - "Export, Reporting & Compliance (HTML, PDF, DICOM, GDPR)"
        - "Scientific Benchmarking & Validation"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or workarounds considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to papers, medical guidelines, references, or mockups.
