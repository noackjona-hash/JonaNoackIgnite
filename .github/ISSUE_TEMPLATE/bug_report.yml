name: "Bug Report"
description: "Report an issue, defect, or unexpected behavior in IGNITE"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report for **IGNITE**! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what went wrong...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start IGNITE (python main.py)
        2. Load image: ...
        3. Adjust parameter / mode: ...
        4. See error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Compute Backend
      description: Which computation backend was active when the issue occurred?
      options:
        - "Python Fallback (NumPy + OpenCV)"
        - "Rust Core (ignite_core / Rayon)"
        - "PyTorch GPU (CUDA Acceleration)"
        - "Startup Issue / Unknown"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running?
      options:
        - "Windows 11 (64-Bit)"
        - "Windows 10 (64-Bit)"
        - "Linux (Ubuntu / Debian / Fedora / Arch)"
        - "macOS (Apple Silicon / Intel)"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment & Hardware Details
      description: Python version, GPU model, IGNITE version.
      placeholder: "e.g., Python 3.10.12, NVIDIA RTX 3060, IGNITE v3.2.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and Stack Traces
      description: Terminal output, log messages, or stack traces.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have tested against the latest version of IGNITE.
          required: true
