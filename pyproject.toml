[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "ignite_core"
version = "3.3.2"
description = "Ignite – Hochleistungs-Rust-Core für die thermografische Entzündungsdetektions-Pipeline"
requires-python = ">=3.10"

[project.optional-dependencies]
gpu = ["torch>=2.0.0"]  # Nur installieren wenn GPU vorhanden
dev = ["pytest>=7.4.0", "matplotlib>=3.8.0", "maturin>=1.4"]  # Nur für Entwicklung

[tool.maturin]
# Bindings-Typ: pyo3 (automatisches PyO3-Modul-Scaffolding)
bindings = "pyo3"
# module-name: Exakter Python-Modulname (muss mit dem #[pymodule] fn-Namen übereinstimmen)
module-name = "ignite_core"
# Kein python-source: Wir liefern nur das native .pyd-Modul, kein Python-Paket-Verzeichnis

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "benchmark: Slow full benchmark suites (run with '-m benchmark' or all with '-m \"\"')",
]
addopts = "-m 'not benchmark'"

